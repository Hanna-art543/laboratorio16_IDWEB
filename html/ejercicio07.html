<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
        }

        #visor {
            width: 100%;
            height: 350px;
            border: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #visor img {
            max-width: 100%;
            max-height: 100%;
        }

        .miniaturas {
            display: flex;
            gap: 10px;
        }

        .miniaturas img {
            width: 100px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .miniaturas img:hover {
            border-color: #2b7cff;
        }
    </style>
</head>
<body>
    <h1>Galería con miniaturas</h1>

    <div id="visor">
        <img id="imagenGrande" src ="imagenes/img1.jpg" alt="Imagen principal">
    </div>

    <div class="miniaturas">
        <img src="imagenes/img1.jpg" class="imagen" alt="Imagen 1">
        <img src="imagenes/img2.jpg" class="imagen" alt="Imagen 1">
        <img src="imagenes/img3.jpg" class="imagen" alt="Imagen 1">
    </div>

    <script src ="../js/ejercicio07.js"></script>
</body>
</html>
