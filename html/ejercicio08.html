<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla dinámica</title>

    <style>
         body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ee8c8c;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #efef65;
            color: white;
        }

        button {
            padding: 10px 16px;
            background: #2b7cff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Tabla dinámica</h1>

    <button id="btnGenerar">Generar tabla</button>

    <div id="Tabla"></div>
    <script src="../js/ejercicio08.js"></script>
</body>
</html>
