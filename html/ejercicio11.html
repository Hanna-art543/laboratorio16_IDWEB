<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini CRUD con DOM</title>

    <style>
         body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        button {
            cursor: pointer;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <h1>CRUD con DOM</h1>
    <form id="form">
        <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
        <input type="number" id="edad" placeholder="Ejem: 12" required>
        <button type="submit">Agregar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script src="../js/ejercicio11.js"></script>
</body>
</html>
