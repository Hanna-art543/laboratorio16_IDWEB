<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegación de eventos</title>

    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
        }

        ul {
            padding: 0;
        }

        li {
            background: #f2f2f2;
            margin: 6px 0;
            padding: 10px;
            list-style: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        li:hover {
            background: #f7c4ed;
        }
    </style>
</head>
<body>

    <h2>Eliminar <li> con delegacion de eventos</h2>

    <ul id="lista">
        <li>Daniel Parck</li>
        <li>Zack</li>
        <li>Goo</li>
        <li>Gun</li>
    </ul>
    
    <script src="../js/ejercicio09.js"></script>
</body>
</html>
